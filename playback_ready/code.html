<style>
        /* Custom Animations for Cinematic Loading State */
        @keyframes subtleSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes etherealPulse {
            0%, 100% { 
                opacity: 0.4; 
                transform: scale(0.95); 
                box-shadow: 0 0 20px rgba(242, 202, 80, 0.1); 
            }
            50% { 
                opacity: 0.8; 
                transform: scale(1.05); 
                box-shadow: 0 0 50px rgba(242, 202, 80, 0.4); 
            }
        }
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-ring-outer {
            animation: subtleSpin 8s linear infinite;
        }
        .anim-ring-inner {
            animation: subtleSpin 4s linear infinite reverse;
        }
        .anim-core-glow {
            animation: etherealPulse 3s ease-in-out infinite;
        }
        .reveal-content {
            animation: fadeInSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative selection:bg-primary/30">
<!-- Note: TopAppBar, BottomNavBar, and NavigationDrawer are intentionally suppressed here. 
         This is a transient/transactional "Playback Ready" screen, requiring full user focus 
         on the primary action, per the Semantic Shell Mandate (Automatic Suppression rule). -->
<!-- Blurred Background Layer -->
<div class="absolute inset-0 z-0 scale-110 pointer-events-none" data-alt="A cinematic, moody still image serving as a heavily blurred background for a luxury streaming interface. The scene is extracted from a fictional high-art film titled 'The Last Frame'. It features dramatic, low-key lighting with deep shadows and soft, golden-hour highlights reflecting off a mysterious textured surface. The color palette is dominated by rich charcoal blacks, deep umber, and glowing amber accents, perfectly matching a minimalist-cinematic aesthetic. The image is severely out of focus, creating a beautiful, soft bokeh effect that adds profound depth without distracting from foreground UI elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDasCRNLraOkYqobbfcGRDRuh3ZZYstEGVkJf4l5252-aiS064xKutRpvfvXQKrpRHNFf_YrG1F-nyNnC8PWW4zY_JKmtTdzy2ihK5jEu7GEMbHHyPVlwGNkktdtscWwYhRvzKLpQ_w_Ryp8oloRX0NeG60o9UYn10iNNIob4mMQe5BHW0N-0f4yX6gzTETJ-YtqttKLjTTsTPC6ocT5mP61Y3n8cbqqu7WOV-aV8TXS7i_gpDU6yzAog')">
<div class="absolute inset-0 backdrop-blur-3xl bg-surface/85"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent opacity-80"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center h-full w-full px-gutter max-w-container-max mx-auto">
<!-- Cinematic Loading Animation -->
<div class="relative flex items-center justify-center mb-xxl reveal-content delay-1">
<!-- Outer delicate ring -->
<div class="absolute w-40 h-40 rounded-full border border-surface-variant anim-ring-outer">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-primary/50"></div>
</div>
<!-- Inner rotating dashed ring -->
<div class="absolute w-32 h-32 rounded-full border border-dashed border-outline/30 anim-ring-inner"></div>
<!-- Core glowing element -->
<div class="w-20 h-20 rounded-full bg-primary/10 border border-primary/40 backdrop-blur-sm flex items-center justify-center anim-core-glow relative z-20">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    play_arrow
                </span>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-xxl reveal-content delay-2">
<h1 class="font-display-lg text-display-lg text-on-surface mb-md tracking-tight">Playback Ready</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                The connection is secure. Your screening of <span class="text-primary/90 italic">The Last Frame</span> is ready to begin.
            </p>
</div>
<!-- Primary Action Button -->
<div class="reveal-content delay-3">
<!-- Using custom styles matching the brand guidelines: "Warm Off-White (#F5F5F1) background with near-black text. 12px roundedness. Bold, uppercase label." 
                 Mapped to Tailwind config: inverse-surface (off-white) and inverse-on-surface (dark text). -->
<button class="bg-inverse-surface text-inverse-on-surface font-label-caps text-label-caps uppercase rounded-xl px-12 py-5 tracking-widest hover:scale-105 hover:bg-surface-tint hover:text-on-primary-fixed transition-all duration-300 shadow-[0_0_40px_rgba(242,202,80,0)] hover:shadow-[0_0_40px_rgba(242,202,80,0.2)] flex items-center gap-3 group">
                Continue to Screening
                <span class="material-symbols-outlined text-[16px] transform group-hover:translate-x-1 transition-transform">
                    arrow_forward
                </span>
</button>
</div>
</main>
